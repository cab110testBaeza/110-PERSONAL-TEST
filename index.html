<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EC">
<title>La mochila de Julia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
html, body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: one column "mochila" — home of chunky sticker tiles, each topic opens cards (Aprende) and an 8-question game (Juega). Single light look that matches the printed fichas. */
:root {
  --ink: #2B2B40;
  --ink-soft: #5A5670;
  --paper: #FFF8EC;
  --card: #FFFFFF;
  --sun: #F6C445;
  --sun-soft: #FFF1C7;
  --sky: #2F7DD1;
  --good: #2E8B4E;
  --good-bg: #DDF2E3;
  --good-ink: #1E5E36;
  --bad: #C0392B;
  --bad-bg: #FFE3DC;
  --bad-ink: #8F2A1F;
  --font-display: 'Fredoka', 'Nunito', 'Trebuchet MS', sans-serif;
  --font-body: 'Nunito', 'Trebuchet MS', 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4; }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 14px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
button { font: inherit; color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); text-wrap: balance; }
p { margin: 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 5vw, 30px); }
.brand svg { width: 44px; height: 44px; }
.starpill { display: flex; align-items: center; gap: 6px; background: var(--card); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 14px 4px 8px; font-family: var(--font-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.st { width: 22px; height: 22px; flex: none; }
.st path { fill: var(--card); stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
.st.on path { fill: var(--sun); }
.st.big { width: 64px; height: 64px; }

.hero { background: var(--sun-soft); border: 3px solid var(--ink); border-radius: 28px; padding: 18px 20px; display: flex; gap: 16px; align-items: center; }
.hero svg { width: 76px; height: 76px; flex: none; }
.hero h1 { font-size: clamp(28px, 6vw, 38px); line-height: 1.05; }
.hero p { margin-top: 6px; font-size: 16px; font-weight: 700; color: var(--ink-soft); max-width: 52ch; }
.hero > div { min-width: 0; }

.group { display: flex; flex-direction: column; gap: 12px; }
.group h2 { font-size: 26px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.group h2 span { font-family: var(--font-body); font-size: 14px; font-weight: 700; color: var(--ink-soft); letter-spacing: .04em; text-transform: uppercase; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.tile { background: var(--tile); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 5px 0 var(--ink); padding: 12px 12px 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; cursor: pointer; transition: transform .12s, box-shadow .12s; }
.tile:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--ink); }
.tile:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.tile .ico { width: 56px; height: 56px; }
.num { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.tile .name { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.1; }
.tile .sub { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.stars { display: flex; gap: 2px; margin-top: 4px; }

.back { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 3px 0 var(--ink); padding: 6px 14px 6px 10px; font-family: var(--font-display); font-weight: 600; font-size: 17px; cursor: pointer; align-self: flex-start; }
.arw { width: 20px; height: 20px; flex: none; }
.thead { background: var(--tile); border: 3px solid var(--ink); border-radius: 24px; padding: 14px 18px; display: flex; gap: 14px; align-items: center; }
.thead .ico { width: 68px; height: 68px; flex: none; }
.thead > div { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.thead h1 { font-size: clamp(26px, 6vw, 36px); line-height: 1.05; }
.thead .sub { font-weight: 700; color: var(--ink-soft); }
.tabs { display: flex; gap: 6px; background: var(--card); border: 3px solid var(--ink); border-radius: 999px; padding: 4px; align-self: flex-start; }
.tab { border: 0; background: transparent; border-radius: 999px; padding: 8px 20px; font-family: var(--font-display); font-weight: 600; font-size: 19px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.tab .st { width: 16px; height: 16px; }
#pane { display: flex; flex-direction: column; gap: 18px; }
.tip { font-weight: 700; color: var(--ink-soft); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 12px; }
.wcard { background: var(--card); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 4px 0 var(--ink); padding: 12px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
.wcard .ico { width: 64px; height: 64px; }
.wcard .spkmini { width: 34px; height: 34px; margin: 8px 0 6px; color: var(--sky); }
.wcard .en { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.1; text-align: center; overflow-wrap: anywhere; }
.wcard .es { font-size: 13px; font-weight: 700; color: var(--ink-soft); text-align: center; }
.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.07); } 100% { transform: scale(1); } }

.panel { background: var(--card); border: 3px solid var(--ink); border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.panel h3 { font-size: 22px; }
.phrase { display: flex; align-items: center; gap: 12px; padding: 8px 10px; background: var(--sun-soft); border-radius: 16px; }
.phrase > div { min-width: 0; }
.phrase b { font-family: var(--font-display); font-weight: 600; font-size: 20px; display: block; line-height: 1.15; }
.phrase span { font-size: 14px; font-weight: 700; color: var(--ink-soft); }
.spk { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); background: var(--sun); display: grid; place-items: center; cursor: pointer; box-shadow: 0 3px 0 var(--ink); padding: 0; }
.spk svg { width: 22px; height: 22px; }
.spk.big { width: 88px; height: 88px; box-shadow: 0 5px 0 var(--ink); }
.spk.big svg { width: 42px; height: 42px; }
.spk:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }

.exam { background: var(--ink); color: var(--paper); border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.exam h3 { font-size: 22px; display: flex; align-items: center; gap: 10px; }
.exam h3 svg { width: 26px; height: 26px; }
.exam p { font-size: 14px; font-weight: 700; color: #D9D5E8; }
.chk { display: flex; gap: 12px; align-items: flex-start; font-weight: 700; cursor: pointer; }
.chk input { width: 22px; height: 22px; accent-color: var(--sun); flex: none; margin: 1px 0 0; }

.cta { align-self: center; display: inline-flex; align-items: center; gap: 10px; background: var(--sun); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 5px 0 var(--ink); padding: 12px 28px; font-family: var(--font-display); font-weight: 700; font-size: 24px; cursor: pointer; }
.cta:active, .btn2:active, .next:active, .back:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn2 { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 4px 0 var(--ink); padding: 10px 20px; font-family: var(--font-display); font-weight: 600; font-size: 18px; cursor: pointer; }

.qcard { background: var(--card); border: 3px solid var(--ink); border-radius: 28px; padding: 20px clamp(14px, 3vw, 24px); display: flex; flex-direction: column; gap: 16px; align-items: center; }
.dots { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); background: var(--card); }
.dot.now { background: var(--sun); }
.dot.ok { background: var(--good); }
.dot.ko { background: var(--bad); }
.prompt { font-family: var(--font-display); font-size: clamp(22px, 5vw, 30px); font-weight: 600; text-align: center; line-height: 1.15; }
.hint { color: var(--ink-soft); font-weight: 700; font-size: 16px; text-align: center; }
.big-word { font-family: var(--font-display); font-size: clamp(36px, 9vw, 54px); font-weight: 700; line-height: 1; text-align: center; overflow-wrap: anywhere; }
.media { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.media .ico { width: 76px; height: 76px; }
.media .scene { width: 190px; height: 152px; max-width: 100%; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; width: 100%; }
.opt { background: var(--card); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 4px 0 var(--ink); min-height: 66px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 21px; line-height: 1.15; text-align: center; transition: transform .1s, box-shadow .1s; }
.opt:hover:not([disabled]) { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
.opt[disabled] { cursor: default; }
.opt .ico { width: 84px; height: 84px; }
.opt .scene { width: 150px; height: 120px; max-width: 100%; }
.opt.right { background: var(--good-bg); border-color: var(--good); box-shadow: 0 4px 0 var(--good); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); box-shadow: 0 4px 0 var(--bad); animation: shake .4s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.feedback { width: 100%; border-radius: 18px; padding: 12px 16px; font-family: var(--font-display); font-size: 22px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.feedback.good { background: var(--good-bg); color: var(--good-ink); }
.feedback.bad { background: var(--bad-bg); color: var(--bad-ink); }
.next { display: inline-flex; align-items: center; gap: 8px; background: var(--sun); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 4px 0 var(--ink); padding: 8px 20px; font-family: var(--font-display); font-weight: 700; font-size: 20px; cursor: pointer; }
.bigstars { display: flex; gap: 8px; }
.endbtns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

@media (max-width: 480px) {
  .opts.pics { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .opts.pics .opt { padding: 8px 4px; }
  .opts.pics .opt .ico { width: 64px; height: 64px; }
  .hero svg { width: 56px; height: 56px; }
  .thead .ico { width: 52px; height: 52px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">

      <span>La mochila de Julia</span>

</div>

      window.speechSynthesis.speak(u);

        g.gain.exponentialRampToValueAtTime(0.0001, s + 0.25);

  }

      if (pool.length < 2) pool = t.items.filter(function (y) { return y.en !== x.en; });
      if (x.s) { var withS = pool.filter(function (y) { return y.s; }); if (withS.length >= 2) pool = withS; }
      out.push({ kind: i % 2 ? 'tr' : 'ls', x: x, opts: shuffle([x].concat(shuffle(pool).slice(0, 2))) });
    }

      }
    } else if (q.kind === 'tr') {
      head = '<p class="prompt">¿Cómo se dice en inglés?</p>' + (q.x.s ? '<div class="media">' + ico(q.x, q.x.vb === SC ? 'scene' : 'ico') + '</div>' : '') + '<p class="big-word">' + q.x.es + '</p>';
      opts = q.opts.map(function (o) { return '<button class="opt" data-val="' + esc(o.en) + '"><span>' + o.en + '</span></button>'; }).join('');
    } else {
      head = (q.media ? '<div class="media">' + q.media + '</div>' : '') + '<p class="prompt">' + q.q + '</p>' + (q.es ? '<p class="hint">' + q.es + '</p>' : '') +
        (q.say && canSpeak ? '<button class="spk" data-say="' + esc(q.say) + '" aria-label="Escuchar la pregunta">' + SPK + '</button>' : '');
      opts = q.options.map(function (o) { return '<button class="opt" data-val="' + esc(o) + '"><span>' + o + '</span></button>'; }).join('');
      speakNow = q.say || null;
    }
    pane.innerHTML = '<div class="qcard"><div class="dots" role="img" aria-label="Pregunta ' + (Q.i + 1) + ' de ' + Q.qs.length + '">' + dots + '</div>' + head +
      '<div class="opts' + (pics ? ' pics' : '') + '">' + opts + '</div><div class="feedback" id="fb" hidden></div></div>';
    if (speakNow) setTimeout(function () { say(speakNow); }, 250);
  }

  function answer(btn) {
    if (!Q || Q.answered) return;
    Q.answered = true;
    var q = Q.qs[Q.i], right = answerOf(q), ok = btn.getAttribute('data-val') === right;
    document.querySelectorAll('#pane .opt').forEach(function (b) { b.disabled = true; if (b.getAttribute('data-val') === right) b.classList.add('right'); });
    if (!ok) btn.classList.add('wrong');
    Q.res[Q.i] = ok; if (ok) Q.score++;
    tone(ok ? [660, 880] : [300, 220]);
    if (!(q.kind === 'c' && q.sp)) setTimeout(function () { say(right); }, 420);
    var fb = document.getElementById('fb');
    fb.hidden = false;
    fb.className = 'feedback ' + (ok ? 'good' : 'bad');
    var last = Q.i >= Q.qs.length - 1;
    fb.innerHTML = '<span>' + (ok ? pick(['¡Muy bien!', '¡Genial!', '¡Perfecto!', '¡Bravo, Julia!']) : '¡Casi! Es: <b>' + right + '</b>') + '</span>' +
      '<button class="next" data-action="next">' + (last ? 'Ver estrellas' : 'Siguiente') + ' ' + ARR + '</button>';
    var nb = fb.querySelector('.next'); if (nb) nb.focus({ preventScroll: true });
  }

  function next() {
    if (!Q) return;
    Q.i++;
    if (Q.i >= Q.qs.length) renderEnd(); else renderQ();
  }

  function renderEnd() {
    var t = cur, sc = Q.score, total = Q.qs.length;
    var s = sc === total ? 3 : sc >= 6 ? 2 : sc >= 3 ? 1 : 0;
    var prev = store.stars[t.id] || 0, record = s > prev;
    if (record) { store.stars[t.id] = s; save(); }
    var msg = s === 3 ? '¡Perfecto, Julia!' : s === 2 ? '¡Muy bien!' : s === 1 ? '¡Bien! Un poco más y lo bordas.' : '¡Sigue practicando!';
    document.getElementById('pane').innerHTML = '<div class="qcard"><div class="bigstars">' + star(s > 0, true) + star(s > 1, true) + star(s > 2, true) + '</div>' +
      '<p class="prompt">' + msg + '</p><p class="hint">Has acertado ' + sc + ' de ' + total + '.' + (record ? ' ¡Nuevo récord en esta ficha!' : '') + '</p>' +
      '<div class="endbtns"><button class="cta" data-mode="play">Jugar otra vez</button><button class="btn2" data-mode="learn">Repasar tarjetas</button><button class="btn2" data-action="home">' + BACK + ' Fichas</button></div></div>';
    var tabStars = document.querySelector('.tab[data-mode="play"]');
    if (tabStars) tabStars.innerHTML = 'Juega ' + starsRow(store.stars[t.id] || 0);
    updatePill();
    tone(s >= 2 ? [523, 659, 784, 1047] : [523, 659]);
    if (s === 3) setTimeout(function () { say('Well done, Julia!'); }, 700);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.topic) { openTopic(b.dataset.topic, 'learn'); return; }
    if (b.dataset.action === 'home') { renderHome(); window.scrollTo(0, 0); return; }
    if (b.dataset.action === 'next') { next(); return; }
    if (b.dataset.mode && cur) { openTopic(cur.id, b.dataset.mode); return; }
    if (b.classList.contains('opt')) { answer(b); return; }
    if (b.dataset.say) {
      say(b.dataset.say);
      if (b.classList.contains('wcard')) { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el.matches || !el.matches('[data-chk]')) return;
    var id = el.getAttribute('data-chk'), i = +el.getAttribute('data-i');
    var arr = store.checks[id] || [];
    arr[i] = el.checked; store.checks[id] = arr; save();
  });

  renderHome();
})();
</script>
</body>
</html>
